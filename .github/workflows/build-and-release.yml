name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installer and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match version.py ($v)"; exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run core tests
        run: python -m pytest -q tests/test_gestures.py tests/test_config_migration_v5.py tests/test_personal.py tests/test_win_input.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        run: python build_exe.py --installer

      - name: Checksum and portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $setup = "dist/installer/JARVIS-Setup-$v.exe"
          if (-not (Test-Path $setup)) { Write-Error "Installer not found: $setup"; exit 1 }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  JARVIS-Setup-$v.exe" | Out-File -Encoding ascii "$setup.sha256"
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath "dist/installer/JARVIS-$v-portable.zip" -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: J.A.R.V.I.S. v${{ steps.ver.outputs.version }}
          files: |
            dist/installer/JARVIS-Setup-${{ steps.ver.outputs.version }}.exe
            dist/installer/JARVIS-Setup-${{ steps.ver.outputs.version }}.exe.sha256
            dist/installer/JARVIS-${{ steps.ver.outputs.version }}-portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
