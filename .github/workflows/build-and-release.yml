name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'J.A.R.V.I.S. v1.0.0 — Windows Release'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Gesture Test Suite
        run: |
          python tests/test_gestures.py

      - name: Build Windows Executable
        run: |
          python build_exe.py

      - name: Package Release ZIP
        shell: powershell
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version || 'v1.0.0' }}" }
          $zipName = "JARVIS-${ver}-Windows-x64.zip"
          Compress-Archive -Path "dist/jarvis/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "Created release archive: dist/$zipName"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version || 'v1.0.0') }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_title || 'J.A.R.V.I.S. v1.0.0 — Windows Release') }}
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
